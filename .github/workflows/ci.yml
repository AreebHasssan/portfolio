name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/portfoliobackend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest

      - name: Set up kubectl context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      - name: Check Kubernetes API endpoint
        id: kube-endpoint
        run: |
          SERVER="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [[ "$SERVER" =~ (127\.0\.0\.1|localhost) ]]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: kubeconfig server '$SERVER' is not reachable from GitHub-hosted runners."
          else
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy update to Kubernetes VM
        if: steps.kube-endpoint.outputs.reachable == 'true'
        run: |
          kubectl apply -f Backend/portfoliobackend/k8s/manifests/
          kubectl rollout restart deployment portfolio-backend
          kubectl rollout status deployment portfolio-backend --timeout=120s
