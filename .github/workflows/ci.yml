name: Build and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-backend:latest"
          docker build -t "${IMAGE_NAME}" ./Backend/portfoliobackend

      - name: Push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio-backend:latest"
          docker push "${IMAGE_NAME}"

      - name: Configure kubectl context
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "${HOME}/.kube/config"

      - name: Update Kubernetes
        if: ${{ secrets.KUBE_CONFIG != '' }}
        run: |
          kubectl rollout restart deployment portfolio-backend
